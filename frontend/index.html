<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Industry AI Adoption Research Agent</title>
<style>
  body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
  select, button { padding: 8px 12px; font-size: 16px; margin-right: 10px; }
  #report { white-space: pre-wrap; background: #f5f5f5; padding: 20px; margin-top: 20px; border-radius: 8px; }
  #loading { display: none; color: #666; margin-top: 10px; }
</style>
</head>
<body>

<h1>Industry AI Adoption Research Agent</h1>
<p>Select an industry to generate a live AI-training case study report.</p>

<select id="industry">
  <option value="IT">IT / Software</option>
  <option value="Finance">Finance</option>
  <option value="Healthcare">Healthcare</option>
  <option value="Core Engineering">Core Engineering</option>
</select>
<button onclick="generateReport()">Generate Report</button>

<div id="loading">Researching... this can take 15-30 seconds ⏳</div>
<div id="report"></div>

<script>
async function generateReport() {
  const industry = document.getElementById("industry").value;
  const loading = document.getElementById("loading");
  const reportDiv = document.getElementById("report");

  loading.style.display = "block";
  reportDiv.textContent = "";

  try {
    const res = await fetch(`http://localhost:8000/generate-report?industry=${encodeURIComponent(industry)}`);
    const data = await res.json();
    reportDiv.textContent = data.report;
  } catch (err) {
    reportDiv.textContent = "Error: " + err.message;
  } finally {
    loading.style.display = "none";
  }
}
</script>

</body>
</html>
